<!DOCTYPE html>
<html>
  <head>
    <title>Loading...</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container">
      <p style="margin-top: 40px; color: #6b6b8a;">Loading your planner...</p>
    </div>

    <script>
      /* =======================
         HANDLER
         This page sits between login and the app.
         It checks that the session token is valid
         before letting the user into the app.
         If the token is missing or invalid,
         it sends the user back to login.
      ======================= */
      async function verifyAndRedirect() {
        const token = localStorage.getItem('token');

        // If there's no token at all, go back to login
        if (!token) {
          window.location.href = 'login.html';
          return;
        }

        try {
          // Try a simple authenticated request to verify the token works
          const res = await fetch('/api/classes', {
            headers: { 'Authorization': `Bearer ${token}` }
          });

          if (res.ok || res.status === 200) {
            // Token is valid — go to the app
            window.location.href = 'index.html';
          } else {
            // Token is invalid or expired — clear it and go to login
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
          }
        } catch (err) {
          console.error(err);
          // If the server is unreachable, go back to login
          window.location.href = 'login.html';
        }
      }

      verifyAndRedirect();
    </script>
  </body>
</html>
