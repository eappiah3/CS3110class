<!DOCTYPE html>
<html>
  <head>
    <title>TaskMap</title>
    <link rel="stylesheet" href="styles.css">

    <!-- FullCalendar library — handles all the calendar rendering -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <script>
      // If there is no token, send to login page right away
      if (!localStorage.getItem('token')) {
        window.location.href = 'login.html';
      }
      document.getElementById('welcomeMsg').textContent = `Welcome, ${localStorage.getItem('username')}!`;
    </script>
  </head>
  <body>
    <div class="container">

      <!-- TOP BAR -->
      <div class="top-bar">
        <h1>TaskMap</h1>
        <p id="welcomeMsg" style="font-size: 14px; color: #6b6b8a;"></p>
        </div>
        <button onclick="logout()">Log Out</button>
      </div>

      <!-- TAB BUTTONS -->
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('todo', this)">To-Do List</button>
        <button class="tab-btn" onclick="showTab('schedule', this)">Schedule</button>
        <button class="tab-btn" onclick="showTab('calendar', this)">Calendar</button>
      </div>

      <!-- TO-DO TAB -->
      <div id="todo" class="tab-content">
        <form id="todoForm">
          <input type="text" id="input" placeholder="Add Task" required>
          <!-- Optional due date for the task -->
          <label style="font-size: 13px; color: #6b6b8a;">
            Due Date <span style="font-weight: 400;">(optional)</span>
            <input type="date" id="due_date">
          </label>
          <button type="submit">Add To List</button>
        </form>
        <p style="font-size: 13px; color: #6b6b8a; margin-bottom: 10px;">
          Click an item to edit or delete
        </p>
        <ul id="todoList"></ul>
      </div>

      <!-- SCHEDULE TAB -->
      <div id="schedule" class="tab-content" style="display: none;">
        <form id="classScheduleForm">

          <!-- Event Title -->
          <input type="text" id="className" placeholder="Event Title" required>

          <!-- Multi-day checkboxes -->
          <div class="day-checkboxes">
            <span class="day-label">Days:</span>
            <label><input type="checkbox" name="day" value="Monday"> Mon</label>
            <label><input type="checkbox" name="day" value="Tuesday"> Tue</label>
            <label><input type="checkbox" name="day" value="Wednesday"> Wed</label>
            <label><input type="checkbox" name="day" value="Thursday"> Thu</label>
            <label><input type="checkbox" name="day" value="Friday"> Fri</label>
            <label><input type="checkbox" name="day" value="Saturday"> Sat</label>
            <label><input type="checkbox" name="day" value="Sunday"> Sun</label>
          </div>

          <!-- Time and location -->
          <input type="time" id="time" required>
          <input type="text" id="location" placeholder="Location (optional)">

          <!-- Start date -->
          <label style="font-size: 13px; color: #6b6b8a;">
            Start Date
            <input type="date" id="start_date" required>
          </label>

          <!-- Frequency dropdown -->
          <select id="frequency" onchange="toggleRepeatFields()">
            <option value="none">Does not repeat</option>
            <option value="weekly">Repeats weekly</option>
            <option value="monthly">Repeats monthly</option>
            <option value="specific">Specific dates</option>
          </select>

          <!-- End date and specific dates — only shown when repeating -->
          <div id="repeatFieldsWrapper" style="display: none;">

            <!-- End date — shown for weekly and monthly -->
            <div id="endDateWrapper">
              <label style="font-size: 13px; color: #6b6b8a;">
                End Date <span style="font-weight: 400;">(optional)</span>
                <input type="date" id="end_date">
              </label>
            </div>

            <!-- Specific dates input — only shown when "Specific dates" is selected -->
            <div id="specificDatesWrapper" style="display: none;">
              <input type="text" id="specific_dates" placeholder="e.g. 2026-05-01, 2026-05-15">
              <small>Enter dates separated by commas (YYYY-MM-DD)</small>
            </div>

          </div>

          <button type="submit">Add Event</button>
        </form>

        <p style="font-size: 13px; color: #6b6b8a; margin-bottom: 10px;">
          Click an item to edit or delete
        </p>
        <ul id="classSchedule"></ul>
      </div>

      <!-- CALENDAR TAB -->
      <div id="calendar" class="tab-content" style="display: none;">
        <div id="calendarView"></div>
      </div>

    </div>

    <script>
      // Switch between tabs
      function showTab(tabName, clickedBtn) {
        document.querySelectorAll('.tab-content').forEach(tab => {
          tab.style.display = 'none';
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        document.getElementById(tabName).style.display = 'block';
        clickedBtn.classList.add('active');

        // If switching to calendar, refresh it so it renders correctly
        if (tabName === 'calendar' && window.myCalendar) {
          window.myCalendar.render();
        }
      }

      /* =======================
         TOGGLE REPEAT FIELDS
         Shows end date for weekly/monthly,
         shows specific dates input for specific,
         hides everything if "does not repeat".
      ======================= */
      function toggleRepeatFields() {
        const frequency          = document.getElementById('frequency').value;
        const repeatWrapper      = document.getElementById('repeatFieldsWrapper');
        const endDateWrapper     = document.getElementById('endDateWrapper');
        const specificWrapper    = document.getElementById('specificDatesWrapper');

        if (frequency === 'none') {
          // Hide everything
          repeatWrapper.style.display   = 'none';
          specificWrapper.style.display = 'none';
        } else if (frequency === 'specific') {
          // Show specific dates, hide end date
          repeatWrapper.style.display   = 'block';
          endDateWrapper.style.display  = 'none';
          specificWrapper.style.display = 'block';
        } else {
          // Weekly or monthly — show end date, hide specific dates
          repeatWrapper.style.display   = 'block';
          endDateWrapper.style.display  = 'block';
          specificWrapper.style.display = 'none';
        }
      }

      /* =======================
         LOGOUT
         Tells the server to delete the session token,
         then clears localStorage and goes to login.
      ======================= */
      async function logout() {
        const token = localStorage.getItem('token');
        try {
          await fetch('/api/logout', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          });
        } catch (err) {
          console.error('Logout error:', err);
        } finally {
          localStorage.removeItem('token');
          localStorage.removeItem('username');
          window.location.href = 'login.html';
        }
      }
    </script>

    <script src="ToDoListScript.js"></script>
    <script src="ClassScheduleScript.js"></script>
    <script src="calendarScript.js"></script>
  </body>
</html>
