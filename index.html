<!DOCTYPE html>
<html>
  <head>
    <title>My Planner</title>
    <link rel="stylesheet" href="styles.css">

    <!-- FullCalendar library — handles all the calendar rendering -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <script>
      // If not logged in, send to login page right away
      if (!localStorage.getItem("username") || !localStorage.getItem("password")) {
        window.location.href = 'login.html';
      }
    </script>
  </head>
  <body>
    <div class="container">

      <!-- TOP BAR -->
      <div class="top-bar">
        <h1>My Planner</h1>
        <button onclick="logout()">Log Out</button>
      </div>

      <!-- TAB BUTTONS -->
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('todo', this)">To-Do List</button>
        <button class="tab-btn" onclick="showTab('schedule', this)">Schedule</button>
        <button class="tab-btn" onclick="showTab('calendar', this)">Calendar</button>
      </div>

      <!-- TO-DO TAB -->
      <div id="todo" class="tab-content">
        <form id="todoForm">
          <input type="text" id="input" placeholder="Add Task" required>
          <!-- Optional due date for the task -->
          <input type="date" id="due_date" title="Due Date (optional)">
          <button type="submit">Add To List</button>
        </form>
        <ul id="todoList"></ul>
      </div>

      <!-- SCHEDULE TAB -->
      <div id="schedule" class="tab-content" style="display: none;">
        <form id="classScheduleForm">

          <!-- Class name -->
          <input type="text" id="className" placeholder="Class Name" required>

          <!-- Multi-day checkboxes -->
          <div class="day-checkboxes">
            <span class="day-label">Days:</span>
            <label><input type="checkbox" name="day" value="Sunday"> Sunday</label>
            <label><input type="checkbox" name="day" value="Monday"> Monday</label>
            <label><input type="checkbox" name="day" value="Tuesday"> Tueuesday</label>
            <label><input type="checkbox" name="day" value="Wednesday"> Wednesday</label>
            <label><input type="checkbox" name="day" value="Thursday"> Thursday</label>
            <label><input type="checkbox" name="day" value="Friday"> Friday</label>
            <label><input type="checkbox" name="day" value="Saturday"> Saturday</label>
          </div>

          <!-- Time and location -->
          <input type="time" id="time" required>
          <input type="text" id="location" placeholder="Location (optional)">

          <!-- Start date -->
          <input type="date" id="start_date" title="Start Date" required>

          <!-- Frequency dropdown -->
          <select id="frequency" onchange="toggleSpecificDates()">
            <option value="none">Does not repeat</option>
            <option value="weekly">Repeats weekly</option>
            <option value="monthly">Repeats monthly</option>
            <option value="specific">Specific dates</option>
          </select>

          <!-- Specific dates input — only shown when "Specific dates" is selected -->
          <div id="specificDatesWrapper" style="display: none;">
            <input type="text" id="specific_dates" placeholder="e.g. 2026-05-01, 2026-05-15">
            <small>Enter dates separated by commas (YYYY-MM-DD)</small>
          </div>

          <button type="submit">Add Class</button>
        </form>

        <p style="font-size: 13px; color: #6b6b8a; margin-bottom: 10px;">
          Double-click an item to edit or delete
        </p>
        <ul id="classSchedule"></ul>
      </div>

      <!-- CALENDAR TAB -->
      <div id="calendar" class="tab-content" style="display: none;">
        <div id="calendarView"></div>
      </div>

    </div>

    <script>
      // Switch between tabs
      function showTab(tabName, clickedBtn) {
        // Hide all tab content
        document.querySelectorAll('.tab-content').forEach(tab => {
          tab.style.display = 'none';
        });
        // Remove active style from all tab buttons
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        // Show the selected tab
        document.getElementById(tabName).style.display = 'block';
        // Highlight the clicked button
        clickedBtn.classList.add('active');

        // If switching to calendar, refresh it so it renders correctly
        if (tabName === 'calendar' && window.myCalendar) {
          window.myCalendar.render();
        }
      }

      // Show or hide the specific dates input based on frequency selection
      function toggleSpecificDates() {
        const frequency = document.getElementById('frequency').value;
        const wrapper = document.getElementById('specificDatesWrapper');
        wrapper.style.display = frequency === 'specific' ? 'block' : 'none';
      }

      function logout() {
        localStorage.removeItem("username");
        localStorage.removeItem("password");
        window.location.href = 'login.html';
      }
    </script>

    <script src="ToDoListScript.js"></script>
    <script src="ClassScheduleScript.js"></script>
    <script src="calendarScript.js"></script>
  </body>
</html>
